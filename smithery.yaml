# Smithery configuration for Consulta Veicular Nacional
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_veiculo_nacional

name: veiculo_nacional-mcp
displayName: "Consulta Veicular Nacional"
description: >
  Dados cadastrais de um veículo a partir da placa em base nacional: marca, modelo, ano de fabricação, cor e demais características. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/veiculo_nacional-mcp
repository: https://github.com/mcp-dir/veiculo_nacional-mcp

tags:
  - veiculo_nacional
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_veiculo_nacional

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_veiculo_nacional/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
